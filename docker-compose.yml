name: intelhub

x-backend-env: &backend-env
  DATABASE_URL: jdbc:postgresql://postgres:5432/intelhub
  DATABASE_USER: intelhub
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-intelhub}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  ROCKETMQ_NAME_SERVER: namesrv:9876
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
  ELASTICSEARCH_URL: http://elasticsearch:9200
  MCP_SERVER_URL: http://mcp-server:9099/mcp
  AI_PRIMARY_BASE_URL: ${AI_PRIMARY_BASE_URL:-}
  AI_PRIMARY_API_KEY: ${AI_PRIMARY_API_KEY:-}
  AI_PRIMARY_MODEL: ${AI_PRIMARY_MODEL:-}
  AI_FALLBACK_BASE_URL: ${AI_FALLBACK_BASE_URL:-}
  AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
  AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
  CHAT_MODEL_FAILURE_THRESHOLD: ${CHAT_MODEL_FAILURE_THRESHOLD:-3}
  CHAT_MODEL_CIRCUIT_COOLDOWN_MILLIS: ${CHAT_MODEL_CIRCUIT_COOLDOWN_MILLIS:-30000}
  CHAT_MAX_CONCURRENT: ${CHAT_MAX_CONCURRENT:-4}
  CHAT_MAX_WAIT_SECONDS: ${CHAT_MAX_WAIT_SECONDS:-30}
  CHAT_PERMIT_LEASE_SECONDS: ${CHAT_PERMIT_LEASE_SECONDS:-600}
  AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
  AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
  AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
  AI_RERANK_BASE_URL: ${AI_RERANK_BASE_URL:-}
  AI_RERANK_API_KEY: ${AI_RERANK_API_KEY:-}
  AI_RERANK_MODEL: ${AI_RERANK_MODEL:-}
  RAG_MIN_VECTOR_SIMILARITY: ${RAG_MIN_VECTOR_SIMILARITY:-0.25}
  RAG_MIN_LEXICAL_OVERLAP: ${RAG_MIN_LEXICAL_OVERLAP:-0.1}
  ROCKETMQ_SEND_MESSAGE_TIMEOUT: ${ROCKETMQ_SEND_MESSAGE_TIMEOUT:-10000}
  INTELHUB_ADMIN_USERNAME: ${INTELHUB_ADMIN_USERNAME:-}
  INTELHUB_ADMIN_PASSWORD: ${INTELHUB_ADMIN_PASSWORD:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: intelhub
      POSTGRES_USER: intelhub
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-intelhub}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelhub -d intelhub"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"; else redis-server --appendonly yes; fi"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 30

  elasticsearch:
    build:
      context: .
      dockerfile: infra/elasticsearch/Dockerfile
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms768m -Xmx768m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: ${MINIO_IMAGE:-alpine/minio:RELEASE.2025-10-15T17-29-55Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-change-me}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-19001}:9001"

  namesrv:
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30

  broker:
    image: apache/rocketmq:5.3.2
    user: "0:0"
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    volumes:
      - ./infra/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
      - rocketmq-data:/home/rocketmq/store
    depends_on:
      namesrv:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: backend/mcp-server/Dockerfile
    environment:
      MCP_SERVER_PORT: 9099

  backend-a:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      SERVER_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      namesrv:
        condition: service_healthy
      broker:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
      mcp-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/api/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  backend-b:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      SERVER_PORT: 9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      namesrv:
        condition: service_healthy
      broker:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
      mcp-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/api/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend-a:
        condition: service_healthy
      backend-b:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  minio-data:
  rocketmq-data:
